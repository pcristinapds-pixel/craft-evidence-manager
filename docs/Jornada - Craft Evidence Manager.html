<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada do Craft Evidence Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #1C252D; --cinza: #6B7B88; --cinza-claro: #A7B4BE; --linha: #E3E8EC;
    --fundo: #F6F8FA; --papel: #FFFFFF; --vermelho: #E30613; --ardosia: #1F2D36;
    --foco: rgba(227, 6, 19, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; color: var(--tinta); background: var(--papel); font-size: 15px; line-height: 1.5; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--vermelho); outline-offset: 2px; }

  /* topo */
  .topo { display: flex; align-items: center; gap: 16px; padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--linha); }
  .topo img { height: 30px; }
  .topo h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .topo p { margin: 0; color: var(--cinza); font-size: 14px; }
  .topo .txt { flex: 1; min-width: 0; }

  /* etapas */
  .etapas { display: flex; gap: 4px; padding: 0 clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--linha); overflow-x: auto; scrollbar-width: none; }
  .etapa { flex: 0 0 auto; background: none; border: 0; padding: 14px 10px 12px; cursor: pointer; color: var(--cinza); border-bottom: 2px solid transparent; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .etapa span { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .etapa:hover { color: var(--tinta); }
  .etapa.ativa { color: var(--tinta); border-bottom-color: var(--vermelho); font-weight: 500; }

  /* corpo */
  .corpo { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: calc(100vh - 140px); }
  .palco { padding: 32px clamp(16px, 4vw, 48px); background: var(--fundo); border-right: 1px solid var(--linha); }
  .palco .intro { max-width: 720px; margin: 0 0 20px; }
  .palco .intro h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .palco .intro p { margin: 0; color: var(--cinza); }

  .painel { padding: 32px 28px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
  .painel .rotulo { font-size: 13px; color: var(--cinza); margin-bottom: 6px; }
  .painel h3 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  .painel .obrig { display: inline-block; font-size: 12px; color: var(--cinza); border: 1px solid var(--linha); border-radius: 4px; padding: 1px 7px; margin-bottom: 14px; }
  .painel .obrig.sim { color: var(--vermelho); border-color: #F5C6CA; }
  .painel p { margin: 0 0 14px; }
  .painel .bloco { border-top: 1px solid var(--linha); padding-top: 14px; margin-top: 18px; }
  .painel .bloco b { display: block; font-size: 13px; font-weight: 500; color: var(--cinza); margin-bottom: 4px; }
  .painel code, .exemplo { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .exemplo { background: var(--fundo); border: 1px solid var(--linha); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; display: block; }
  .nav { display: flex; gap: 8px; margin-top: 24px; align-items: center; }
  .nav .pos { flex: 1; font-size: 13px; color: var(--cinza); font-family: 'IBM Plex Mono', monospace; }
  .nav button { border: 1px solid var(--linha); background: var(--papel); border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; font-weight: 500; }
  .nav button:hover:not(:disabled) { border-color: var(--cinza-claro); }
  .nav button.prox { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .nav button:disabled { opacity: .4; cursor: default; }
  .dica-teclas { font-size: 12px; color: var(--cinza-claro); margin-top: 12px; }

  /* ---------- mockups ---------- */
  .janela { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; max-width: 880px; box-shadow: 0 1px 2px rgba(28,37,45,.04); }
  .janela .barra-app { background: var(--ardosia); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .janela .barra-app img { height: 18px; filter: brightness(1.1); }
  .janela .barra-app .esp { flex: 1; }
  .janela .conteudo { padding: 20px; }
  .titulo-sec { font-size: 14px; font-weight: 600; margin: 0 0 12px; }

  /* campo clicável */
  .alvo { position: relative; cursor: pointer; border-radius: 6px; transition: box-shadow .15s, background-color .15s; }
  .alvo:hover { box-shadow: 0 0 0 2px var(--cinza-claro); }
  .alvo.sel { box-shadow: 0 0 0 2px var(--vermelho); background-color: var(--foco); }
  .alvo .n { position: absolute; top: -9px; left: -9px; width: 20px; height: 20px; border-radius: 50%; background: var(--tinta); color: #fff; font: 500 11px 'IBM Plex Mono', monospace; display: grid; place-items: center; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 2; }
  .alvo.sel .n { background: var(--vermelho); opacity: 1; }
  .palco:hover .alvo .n, .mostrar-numeros .alvo .n { opacity: 1; }

  .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .grade .largo { grid-column: 1 / -1; }
  .campo { display: flex; flex-direction: column; gap: 5px; padding: 4px; margin: -4px; }
  .campo label { font-size: 11px; font-weight: 600; color: var(--tinta); letter-spacing: .02em; }
  .entrada { border: 1px solid var(--linha); background: var(--fundo); border-radius: 6px; padding: 8px 10px; font-size: 13px; color: var(--cinza); min-height: 36px; display: flex; align-items: center; justify-content: space-between; }
  .entrada.cheio { color: var(--tinta); }
  textarea.entrada { resize: none; font-family: 'IBM Plex Mono', monospace; display: block; width: 100%; min-height: 96px; color: var(--tinta); line-height: 1.6; }
  .bdd-wrap { position: relative; }
  .bdd-real { position: absolute; inset: 0; padding: 8px 10px; font: 13px/1.6 'IBM Plex Mono', monospace; white-space: pre-wrap; pointer-events: none; color: var(--tinta); border: 1px solid transparent; overflow: hidden; }
  .bdd-wrap textarea { color: transparent; caret-color: var(--tinta); background: var(--fundo); }
  .kw { color: var(--vermelho); font-weight: 500; }
  .kw2 { color: var(--cinza); font-weight: 500; }

  .fontes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .fonte { border: 2px solid var(--linha); border-radius: 8px; padding: 6px; text-align: center; font-size: 11px; font-weight: 600; background: var(--papel); }
  .fonte .tela { aspect-ratio: 16/10; background: #EEF2F6; border-radius: 4px; margin-bottom: 6px; position: relative; overflow: hidden; }
  .fonte .tela::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12%; background: #2B3640; }
  .fonte .tela::after { content: ""; position: absolute; left: 14%; right: 14%; top: 28%; height: 50%; background: repeating-linear-gradient(#fff 0 6px, transparent 6px 12px); opacity: .9; }
  .fonte.escolhida { border-color: var(--vermelho); }
  .acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; align-items: center; }
  .btn { height: 36px; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha); background: var(--papel); }
  .btn.prim { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .btn.txt { border-color: transparent; color: var(--vermelho); background: none; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }

  /* barra flutuante */
  .area-trabalho { max-width: 880px; aspect-ratio: 16/8; background: linear-gradient(180deg, #EEF2F6, #E4EAF0); border-radius: 10px; border: 1px solid var(--linha); position: relative; overflow: hidden; }
  .area-trabalho .sistema { position: absolute; inset: 22% 8% 8% 8%; background: #fff; border-radius: 8px; border: 1px solid var(--linha); }
  .area-trabalho .sistema::before { content: "Sistema em teste"; position: absolute; top: 12px; left: 16px; font-size: 12px; color: var(--cinza); }
  .flutuante { position: absolute; top: 4%; left: 50%; transform: translateX(-50%); background: var(--ardosia); color: #fff; border-radius: 10px; display: flex; gap: 6px; align-items: center; padding: 6px 6px 6px 14px; font-size: 13px; white-space: nowrap; }
  .flutuante .cont { color: #C9D2D9; padding: 4px; margin: -4px 4px -4px -4px; }
  .flutuante .cont b { color: #fff; }
  .fbtn { height: 32px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .fbtn kbd { font: 11px 'IBM Plex Mono', monospace; background: rgba(255,255,255,.12); border-radius: 3px; padding: 1px 5px; color: #C9D2D9; }
  .fbtn .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--vermelho); }
  .fbtn.branco { background: #fff; color: var(--ardosia); }
  .fbtn.vermelho { background: var(--vermelho); }
  .fbtn .ponto.quadrado { background: #fff; border-radius: 2px; }
  .flutuante .alvo.sel { box-shadow: 0 0 0 2px #fff; background-color: rgba(255,255,255,.12); }
  .flutuante .alvo.branco.sel { background-color: #fff; }

  /* revisão */
  .rev-topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .rev { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; }
  .miniaturas { display: flex; flex-direction: column; gap: 10px; padding: 4px; margin: -4px; }
  .mini { border: 2px solid var(--linha); border-radius: 8px; padding: 5px; }
  .mini.ativa { border-color: var(--vermelho); }
  .mini .img { aspect-ratio: 16/9; background: #EEF2F6; border-radius: 4px; position: relative; }
  .mini .img::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14%; background: #2B3640; border-radius: 4px 4px 0 0; }
  .mini .rod { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; margin-top: 4px; }
  .mini .rod span { flex: 1; }
  .seta { width: 20px; height: 18px; border: 1px solid var(--linha); border-radius: 4px; font-size: 8px; display: grid; place-items: center; }
  .editor-ferr { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--cinza); margin-bottom: 8px; flex-wrap: wrap; }
  .editor-ferr .esp { flex: 1; }
  .print { aspect-ratio: 16/9; background: #EEF2F6; border-radius: 6px; border: 1px solid var(--linha); position: relative; overflow: hidden; }
  .print::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10%; background: #2B3640; }
  .print .linhas { position: absolute; left: 10%; right: 10%; top: 22%; display: flex; flex-direction: column; gap: 9%; height: 66%; }
  .print .linhas i { flex: 1; border: 1px solid #C7D0D8; background: #fff; border-radius: 3px; }
  .print .destaque { position: absolute; left: 8.5%; right: 8.5%; top: 34%; height: 13%; border: 3px solid var(--vermelho); border-radius: 3px; }
  .select { border: 1px solid var(--linha); background: var(--fundo); border-radius: 6px; height: 34px; min-width: 200px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; }

  /* editor de vídeo (mock) */
  .ve-video { aspect-ratio: 16/7; background: var(--ardosia); border-radius: 6px; display: grid; place-items: center; color: rgba(255,255,255,.6); font-size: 28px; margin-bottom: 12px; }
  .ve-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .ve-play { width: 32px; height: 32px; border-radius: 6px; background: var(--ardosia); color: #fff; display: grid; place-items: center; font-size: 11px; }
  .ve-tempo { font: 500 13px 'IBM Plex Mono', monospace; }
  .ve-linha { position: relative; height: 44px; margin: 0 -4px; padding: 0 4px; }
  .ve-faixa { position: absolute; left: 4px; right: 4px; top: 10px; height: 24px; border-radius: 4px; background: repeating-linear-gradient(90deg, #DCE3E8 0 1px, #EEF2F5 1px 22px); border: 1px solid #D5DCE2; }
  .ve-fora { position: absolute; top: 10px; height: 24px; background: rgba(31,45,54,.5); margin: 0 4px; }
  .ve-rem { position: absolute; top: 10px; height: 24px; background: repeating-linear-gradient(135deg, rgba(227,6,19,.55) 0 5px, rgba(227,6,19,.22) 5px 10px); border-left: 2px solid var(--vermelho); border-right: 2px solid var(--vermelho); border-radius: 0; }
  .ve-corte { position: absolute; top: 4px; height: 36px; width: 12px; margin-left: -6px; border-radius: 0; }
  .ve-corte::after { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--ardosia); }
  .ve-alca { position: absolute; top: 6px; width: 12px; height: 32px; margin-left: -6px; background: #fff; border: 2px solid var(--ardosia); border-radius: 3px; }
  .ve-cab { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--vermelho); }
  .ve-acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .ve-res { font-size: 13px; color: var(--cinza); margin: 10px -4px 0; padding: 4px; }
  .ve-res b { color: var(--tinta); }

  /* slides */
  .slides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 880px; }
  .slide { aspect-ratio: 16/9; background: #fff; border: 1px solid var(--linha); border-radius: 6px; position: relative; overflow: visible; }
  .slide > *:not(.n) { overflow: hidden; }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.2%; background: var(--vermelho); }
  .slide-wrap > .cap { font-size: 12px; color: var(--cinza); position: absolute; left: 2px; top: 0; font-size: 11px; color: var(--cinza); }
  .slide-wrap { position: relative; padding-top: 20px; container-type: inline-size; }
  .s1 { display: grid; place-items: center; }
  .s1 img { width: 46%; }
  .s2 { padding: 5.5% 5.5% 0; font-size: 2.1cqw; }
  .s2 .logo-mini { position: absolute; right: 5.5%; top: 5.5%; width: 9%; }
  .s2 .hist { color: var(--vermelho); font-weight: 600; font-size: 1.15em; }
  .s2 .tit { font-weight: 600; font-size: 1.9em; line-height: 1.15; margin: .1em 0 .3em; }
  .s2 .traco { width: 7%; height: .25em; background: var(--vermelho); margin-bottom: 1em; }
  .s2 .cen { background: var(--fundo); border: 1px solid var(--linha); border-radius: .4em; padding: .7em .9em; font-size: .9em; line-height: 1.55; margin: -.2em; }
  .s2 .info { display: grid; grid-template-columns: repeat(7, auto); gap: 0 1em; margin-top: 1.2em; font-size: .78em; padding: .2em; margin-left: -.2em; margin-right: -.2em; }
  .s2 .info small { display: block; color: var(--cinza); font-size: .85em; }
  .s2 .ok { color: #1A7F37; font-weight: 600; background: #E8F4EB; border-radius: 1em; padding: 0 .6em; }
  .s3 { padding: 5.5%; font-size: 2.1cqw; }
  .s3 .cab { font-size: .9em; color: var(--cinza); }
  .s3 .cab b { color: var(--vermelho); font-weight: 600; }
  .s3 .print { margin-top: 3%; height: 74%; aspect-ratio: auto; }
  .s3 .logo-mini { position: absolute; right: 5.5%; top: 5.5%; width: 9%; }

  /* fim */
  .fim { max-width: 640px; }
  .fim ol { padding-left: 20px; }
  .fim li { margin-bottom: 8px; }

  @media (max-width: 980px) {
    .corpo { grid-template-columns: 1fr; }
    .palco { border-right: 0; border-bottom: 1px solid var(--linha); }
    .painel { position: static; max-height: none; }
    .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fontes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .slides { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .rev { grid-template-columns: 1fr; }
    .miniaturas { flex-direction: row; overflow-x: auto; }
    .mini { flex: 0 0 140px; }
    .flutuante { transform: translateX(-50%) scale(.8); }
    .topo img { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

      s2info: { nome: 'Slide 2: informações', obrig: false, texto: 'História (com link para o Jira), caso de teste, data e hora, responsável, ambiente, versão e status, numa linha só.', dica: 'A cor do status muda conforme o resultado: verde, vermelho, laranja ou cinza.' },
      s3: { nome: 'Slides de prints', obrig: false, texto: 'Um print por slide, na ordem definida na revisão e com os destaques que você desenhou.', dica: 'O print se ajusta ao slide mantendo a proporção, seja de notebook, monitor comum ou ultrawide.' },
      video: { nome: 'Slide de vídeo', obrig: false, texto: 'Se você gravou vídeo, ele fica embutido num slide próprio e toca direto no PowerPoint. Se você dividiu o vídeo, cada parte ganha um slide.' }
    }
  }
];

// ---------------- estado e renderização ----------------
const $ = id => document.getElementById(id);
let etapa = 0, campo = 0;

function chaves() { return Object.keys(ETAPAS[etapa].campos); }

function renderEtapas() {
  $('etapas').innerHTML = ETAPAS.map((e, i) =>
    `<button class="etapa${i === etapa ? ' ativa' : ''}" data-i="${i}" ${i === etapa ? 'aria-current="step"' : ''}><span>${String(i + 1).padStart(2, '0')}</span>${e.nome}</button>`).join('');
  $('etapas').querySelectorAll('.etapa').forEach(b => b.onclick = () => irPara(+b.dataset.i, 0));
}

function renderPalco() {
  const e = ETAPAS[etapa];
  $('palco').innerHTML = `<div class="intro"><h2>${e.titulo}</h2><p>${e.sub}</p></div>${e.tela()}`;
  const ks = chaves();
  $('palco').querySelectorAll('.alvo').forEach(el => {
    const i = ks.indexOf(el.dataset.k);
    const n = el.querySelector(':scope > .n'); if (n) n.textContent = i + 1;
    el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
    el.setAttribute('aria-label', e.campos[el.dataset.k].nome);
    const escolher = ev => { if (ev.target.closest('textarea')) { campo = i; marcar(); renderPainel(); return; } ev.stopPropagation(); campo = i; marcar(); renderPainel(); };
    el.addEventListener('click', escolher);
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); escolher(ev); } });
  });
  const ta = $('bddTxt');
  if (ta) { ta.addEventListener('input', realcar); ta.addEventListener('scroll', () => { $('bddReal').scrollTop = ta.scrollTop; }); realcar(); }
  marcar();
}

function marcar() {
  const k = chaves()[campo];
  $('palco').querySelectorAll('.alvo').forEach(el => el.classList.toggle('sel', el.dataset.k === k));
}

function renderPainel() {
  const e = ETAPAS[etapa], ks = chaves(), c = e.campos[ks[campo]];
  const ultimo = etapa === ETAPAS.length - 1 && campo === ks.length - 1;
  const primeiro = etapa === 0 && campo === 0;
  $('painel').innerHTML = `
    <div class="rotulo">${e.nome}, ${campo + 1} de ${ks.length}</div>
    <h3>${c.nome}</h3>
    ${c.obrig !== undefined ? `<span class="obrig${c.obrig ? ' sim' : ''}">${c.obrig ? 'Obrigatório' : 'Opcional'}</span>` : ''}
    <p>${c.texto}</p>
    ${c.exemplo ? `<div class="bloco"><b>Exemplo</b><code class="exemplo">${esc(c.exemplo)}</code></div>` : ''}
    ${c.dica ? `<div class="bloco"><b>Dica</b>${c.dica}</div>` : ''}
    <div class="nav">
      <span class="pos">${String(etapa + 1).padStart(2, '0')}/${String(ETAPAS.length).padStart(2, '0')}</span>
      <button id="ant" ${primeiro ? 'disabled' : ''}>Anterior</button>
      <button id="prox" class="prox" ${ultimo ? 'disabled' : ''}>${campo === ks.length - 1 ? 'Próxima etapa' : 'Próximo'}</button>
    </div>
    <div class="dica-teclas">Atalhos: ← → para navegar</div>`;
  $('ant').onclick = anterior;
  $('prox').onclick = proximo;
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function realcar() {
  const t = $('bddTxt').value;
  $('bddReal').innerHTML = t.split('\n').map(l => {
    const m = l.match(/^(\s*)(Dado que|Dado|Quando|Então|Entao|E|Mas)(\s|$)(.*)$/);
    if (!m) return esc(l);
    const cls = (m[2] === 'E' || m[2] === 'Mas') ? 'kw2' : 'kw';
    return esc(m[1]) + `<span class="${cls}">${m[2]}</span>` + esc(m[3] + m[4]);
  }).join('\n') + '\n';
}

function irPara(e, c) {
  const mudou = e !== etapa;
  etapa = e; campo = c;
  try { history.replaceState(null, '', '#' + ETAPAS[etapa].id); } catch {}
  if (mudou) { renderEtapas(); renderPalco(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else marcar();
  renderPainel();
}
function proximo() {
  if (campo < chaves().length - 1) irPara(etapa, campo + 1);
  else if (etapa < ETAPAS.length - 1) irPara(etapa + 1, 0);
}
function anterior() {
  if (campo > 0) irPara(etapa, campo - 1);
  else if (etapa > 0) irPara(etapa - 1, Object.keys(ETAPAS[etapa - 1].campos).length - 1);
}

document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('textarea, input')) return;
  if (ev.key === 'ArrowRight') { ev.preventDefault(); proximo(); }
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); anterior(); }
});

function iniciar() {
  const i = ETAPAS.findIndex(e => '#' + e.id === location.hash);
  etapa = i >= 0 ? i : 0; campo = 0;
  renderEtapas(); renderPalco(); renderPainel();
}
window.addEventListener('hashchange', () => {
  const i = ETAPAS.findIndex(e => '#' + e.id === location.hash);
  if (i >= 0 && i !== etapa) irPara(i, 0);
});
iniciar();
</script>
